name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC — catch advisories on unchanged dependencies
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # lowest supported version — if the tools pass here they pass on 8.4
          extensions: mbstring, dom, curl, libxml, fileinfo, intl, pdo_mysql, gd, bcmath
          coverage: none
          tools: composer:v2

      - name: Validate composer.json / composer.lock
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Pint (PHP + Blade formatting)
        run: vendor/bin/pint --test

      - name: Larastan (static analysis)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Frontend build
        run: npm run build

      - name: Composer audit (PHP dependencies)
        run: composer audit --no-interaction

      - name: NPM audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  tests:
    name: Tests (PHP ${{ matrix.php }} · MySQL)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The company-official target is PHP 8.3 and 8.4, both on MySQL 8 — the
        # real production environment. No SQLite matrix, no experimental probe.
        php: ['8.3', '8.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: basehafez_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: basehafez_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, curl, libxml, fileinfo, intl, pdo_mysql, gd, bcmath
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment (validate MySQL + migrate)
        run: php artisan base:setup --ci

      - name: Run test suite (Pest · MySQL)
        run: vendor/bin/pest --compact
