name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC — catch advisories on unchanged dependencies
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Pint + Larastan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, curl, libxml, fileinfo, intl, pdo_sqlite, sqlite3, gd, bcmath
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate composer.json
        run: composer validate --strict

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Prepare environment
        run: php artisan base:install --ci

      - name: Pint (PHP + Blade formatting)
        run: |
          npm ci
          vendor/bin/pint --test

      - name: Larastan (static analysis)
        run: vendor/bin/phpstan analyse --no-progress

  tests:
    name: Tests · SQLite (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported versions are 8.3 and 8.4 (they gate merges). 8.5 runs as a
        # forward-looking, non-blocking probe so the "^8.3" constraint is
        # exercised across every version it allows.
        include:
          - php: '8.3'
          - php: '8.4'
          - php: '8.5'
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, curl, libxml, fileinfo, intl, pdo_sqlite, sqlite3, gd, bcmath
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: php artisan base:install --ci

      - name: Run test suite
        run: php artisan test --compact

      - name: Route + view integrity
        run: |
          php artisan route:list > /dev/null
          php artisan view:cache

  tests-mysql:
    name: Tests · MySQL 8 (integration)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: basehafez_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: basehafez_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, curl, libxml, fileinfo, intl, pdo_mysql, gd, bcmath
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: php artisan base:install --ci

      - name: Run test suite (MySQL)
        run: php artisan test --compact

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Blocking, but retried: a transient packagist/SSL error must not turn
      # main red. Three attempts, then fail for real (an actual advisory fails
      # every attempt and still blocks).
      - name: Composer audit
        run: |
          attempt=0
          until composer audit --no-interaction; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 3 ]; then
              echo "::error::composer audit failed after $attempt attempts."
              exit 1
            fi
            echo "composer audit attempt $attempt failed (possible network/SSL flake); retrying in 15s…"
            sleep 15
          done

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Blocking (no continue-on-error): a high-severity advisory in production
      # dependencies must fail the pipeline. If a specific advisory is reviewed
      # and accepted, replace this step with an explicit, commented allowlist
      # (e.g. filter the JSON output for the accepted advisory ID) — never a
      # blanket continue-on-error.
      - name: npm audit (production deps)
        run: |
          attempt=0
          until npm audit --omit=dev --audit-level=high; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 3 ]; then
              echo "::error::npm audit found high-severity advisories in production dependencies."
              exit 1
            fi
            echo "npm audit attempt $attempt failed (possible registry flake); retrying in 15s…"
            sleep 15
          done
