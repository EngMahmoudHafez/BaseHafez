version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "php"]
    groups:
      laravel:
        patterns: ["laravel/*", "illuminate/*"]
      dev-tooling:
        patterns: ["larastan/*", "phpstan/*", "laravel/pint", "phpunit/*", "mockery/*", "nunomaduro/*"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]
    groups:
      build-tooling:
        patterns: ["vite", "laravel-vite-plugin", "@vitejs/*", "sass", "postcss", "autoprefixer", "prettier", "prettier-*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "ci"]
